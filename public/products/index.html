<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý sản phẩm</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #1f2937; background: #f3f4f6; }
    body { margin: 0; padding: 24px; }
    .wrap { max-width: 1180px; margin: auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 8px #00000012; }
    h1 { margin-top: 0; color: #1877f2; }
    h2 { margin: 0 0 14px; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; }
    input, textarea, select { box-sizing: border-box; width: 100%; border: 1px solid #d1d5db; border-radius: 7px; padding: 9px; font: inherit; }
    textarea { min-height: 72px; resize: vertical; }
    .wide { grid-column: 1 / -1; }
    button { border: 0; border-radius: 7px; padding: 9px 13px; cursor: pointer; background: #1877f2; color: #fff; }
    button.secondary { background: #6b7280; }
    button.danger { background: #dc2626; }
    button.warning { background: #d97706; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    #status { color: #2563eb; font-size: 13px; }
    .variant-row { display: grid; grid-template-columns: 1fr 1fr 120px auto; gap: 8px; margin-bottom: 8px; align-items: end; }
    .product { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-top: 10px; }
    .product-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .product-head strong { font-size: 17px; }
    .muted { color: #6b7280; font-size: 13px; }
    .badge { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 12px; background: #dcfce7; color: #166534; }
    .badge.off { background: #fee2e2; color: #991b1b; }
    .variants { margin-top: 10px; font-size: 13px; }
    .variant-color { margin: 4px 0; }
    .images { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .images img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid #e5e7eb; }
    .image-item { position: relative; display: inline-flex; flex-direction: column; gap: 2px; font-size: 10px; color: #6b7280; text-align: center; }
    .image-item.primary img { border: 2px solid #1877f2; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .variant-row { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <h1>Quản lý sản phẩm</h1>
      <div id="status"></div>
    </div>

    <form id="product-form" class="card">
      <h2 id="form-title">Thêm sản phẩm</h2>
      <div class="grid">
        <label>SKU<input id="sku" required></label>
        <label>Tên sản phẩm<input id="name" required></label>
        <label>Trạng thái<select id="product-status"><option value="active">Đang bật</option><option value="inactive">Đang tắt</option></select></label>
        <label>Giá gốc<input id="price" type="number" min="0" step="1000" required></label>
        <label>Giá sale<input id="sale-price" type="number" min="0" step="1000"></label>
        <label>Chất liệu<input id="material"></label>
        <label class="wide">Mô tả<textarea id="description"></textarea></label>
        <label>Hướng dẫn size<textarea id="size-guide"></textarea></label>
      </div>

      <h2 style="margin-top:20px">Màu và tồn kho theo size</h2>
      <div id="variants"></div>
      <div class="actions">
        <button type="button" id="add-variant" class="secondary">+ Thêm màu / size</button>
        <button type="submit">Lưu sản phẩm</button>
        <button type="button" id="cancel-edit" class="secondary" hidden>Huỷ sửa</button>
      </div>
    </form>

    <div class="card">
      <h2>Upload hình sản phẩm</h2>
      <p class="muted">Lưu sản phẩm trước, chọn màu rồi upload nhiều hình. Chọn “Ảnh chính” để đánh dấu ảnh đại diện; các ảnh còn lại là ảnh phụ.</p>
      <div class="grid">
        <label>Sản phẩm<select id="image-product"></select></label>
        <label>Màu<input id="image-color" placeholder="Ví dụ: Đen"></label>
        <label>Hình ảnh<input id="image-files" type="file" accept="image/*" multiple></label>
        <label style="flex-direction:row; align-items:center; gap:8px; margin-top:24px;"><input id="image-primary" type="checkbox" style="width:auto"> Ảnh đầu tiên là ảnh chính</label>
      </div>
      <div class="actions"><button type="button" id="upload-images">Upload hình</button><span id="upload-status" class="muted"></span></div>
    </div>

    <div class="card"><h2>Danh sách sản phẩm</h2><div id="products">Đang tải...</div></div>
  </main>

  <script>
    let products = [];
    let editingId = null;

    const $ = (id) => document.getElementById(id);
    const setStatus = (message, error = false) => {
      $('status').textContent = message;
      $('status').style.color = error ? '#dc2626' : '#2563eb';
    };

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    }

    function addVariantRow(variant = {}) {
      const row = document.createElement('div');
      row.className = 'variant-row';
      row.innerHTML = `<label>Màu<input class="variant-color" value="${escapeHtml(variant.color)}" required></label>
        <label>Size<input class="variant-size" value="${escapeHtml(variant.size)}" required></label>
        <label>Tồn kho<input class="variant-stock" type="number" min="0" value="${Number(variant.stock || 0)}" required></label>
        <button type="button" class="danger remove-variant">Xoá</button>`;
      row.querySelector('.remove-variant').addEventListener('click', () => row.remove());
      $('variants').appendChild(row);
    }

    function readVariants() {
      return [...document.querySelectorAll('.variant-row')].map((row) => ({
        color: row.querySelector('.variant-color').value.trim(),
        size: row.querySelector('.variant-size').value.trim(),
        stock: Number(row.querySelector('.variant-stock').value || 0)
      })).filter((variant) => variant.color && variant.size);
    }

    function readProductForm() {
      return {
        sku: $('sku').value.trim(), name: $('name').value.trim(), status: $('product-status').value,
        price: Number($('price').value || 0), sale_price: $('sale-price').value === '' ? null : Number($('sale-price').value),
        material: $('material').value.trim(), description: $('description').value.trim(),
        size_guide: $('size-guide').value.trim()
      };
    }

    function clearForm() {
      editingId = null;
      $('product-form').reset();
      $('form-title').textContent = 'Thêm sản phẩm';
      $('cancel-edit').hidden = true;
      $('variants').innerHTML = '';
      addVariantRow();
    }

    function editProduct(product) {
      editingId = product.id;
      $('form-title').textContent = `Sửa sản phẩm: ${product.name}`;
      for (const [id, value] of Object.entries({ sku: product.sku, name: product.name, price: product.price, material: product.material, description: product.description, 'size-guide': product.size_guide })) $(id).value = value || '';
      $('sale-price').value = product.sale_price ?? '';
      $('product-status').value = product.status;
      $('variants').innerHTML = '';
      (product.variants || []).forEach(addVariantRow);
      if (!product.variants?.length) addVariantRow();
      $('cancel-edit').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderProducts() {
      const select = $('image-product');
      select.innerHTML = '<option value="">Chọn sản phẩm</option>' + products.map((p) => `<option value="${p.id}">${escapeHtml(p.sku)} - ${escapeHtml(p.name)}</option>`).join('');
      $('products').innerHTML = products.length ? products.map((product) => {
        const grouped = {};
        (product.variants || []).forEach((variant) => { (grouped[variant.color] ||= []).push(`${variant.size}: ${variant.stock}`); });
        return `<article class="product"><div class="product-head"><div><strong>${escapeHtml(product.name)}</strong><div class="muted">SKU: ${escapeHtml(product.sku)} · Giá: ${Number(product.price).toLocaleString('vi-VN')}đ${product.sale_price != null ? ` · Sale: ${Number(product.sale_price).toLocaleString('vi-VN')}đ` : ''}</div></div><span class="badge ${product.status === 'active' ? '' : 'off'}">${product.status === 'active' ? 'Đang bật' : 'Đang tắt'}</span></div>
          <div class="variants">${Object.entries(grouped).map(([color, values]) => `<div class="variant-color"><b>${escapeHtml(color)}</b>: ${escapeHtml(values.join(' · '))}</div>`).join('') || '<span class="muted">Chưa có màu/size</span>'}</div>
          <div class="images">${(product.images || []).map((image) => `<div class="image-item ${image.is_primary ? 'primary' : ''}"><img src="${escapeHtml(image.image_url)}" alt="${escapeHtml(image.color)}"><span>${image.is_primary ? 'Ảnh chính' : 'Ảnh phụ'}</span></div>`).join('')}</div>
          <div class="actions"><button type="button" data-edit="${product.id}">Sửa</button><button type="button" class="warning" data-toggle="${product.id}" data-status="${product.status}">${product.status === 'active' ? 'Tắt' : 'Bật'}</button><button type="button" class="danger" data-delete="${product.id}">Xoá</button></div></article>`;
      }).join('') : '<p class="muted">Chưa có sản phẩm.</p>';
      document.querySelectorAll('[data-edit]').forEach((button) => button.addEventListener('click', () => editProduct(products.find((p) => p.id === Number(button.dataset.edit)))));
      document.querySelectorAll('[data-toggle]').forEach((button) => button.addEventListener('click', () => toggleProduct(Number(button.dataset.toggle), button.dataset.status)));
      document.querySelectorAll('[data-delete]').forEach((button) => button.addEventListener('click', () => deleteProduct(Number(button.dataset.delete))));
    }

    async function loadProducts() {
      const response = await fetch('/api/products?action=list');
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Không thể tải sản phẩm.');
      products = data;
      renderProducts();
    }

    async function saveProduct(event) {
      event.preventDefault();
      try {
        const response = await fetch(`/api/products?action=${editingId ? 'update' : 'create'}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: editingId, product: readProductForm(), variants: readVariants() }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Không thể lưu sản phẩm.');
        setStatus('Đã lưu sản phẩm.');
        clearForm();
        await loadProducts();
      } catch (error) { setStatus(error.message, true); }
    }

    async function toggleProduct(id, currentStatus) {
      const response = await fetch('/api/products?action=toggle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, status: currentStatus === 'active' ? 'inactive' : 'active' }) });
      if (!response.ok) setStatus('Không thể đổi trạng thái.', true); else await loadProducts();
    }

    async function deleteProduct(id) {
      if (!confirm('Xoá sản phẩm này?')) return;
      const response = await fetch('/api/products?action=delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
      if (!response.ok) setStatus('Không thể xoá sản phẩm.', true); else await loadProducts();
    }

    function readFileAsDataUrl(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); }); }
    async function uploadImages() {
      const productId = $('image-product').value;
      const color = $('image-color').value.trim();
      const files = [...$('image-files').files];
      if (!productId || !color || !files.length) { $('upload-status').textContent = 'Chọn sản phẩm, màu và hình ảnh.'; return; }
      try {
        for (const [index, file] of files.entries()) {
          $('upload-status').textContent = `Đang upload ${index + 1}/${files.length}...`;
          const response = await fetch('/api/products?action=upload_image', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ product_id: Number(productId), color, filename: file.name, data: await readFileAsDataUrl(file), is_primary: index === 0 && $('image-primary').checked, sort_order: index }) });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Upload thất bại.');
        }
        $('upload-status').textContent = 'Upload thành công.';
        $('image-files').value = '';
        $('image-primary').checked = false;
        await loadProducts();
      } catch (error) { $('upload-status').textContent = error.message; }
    }

    $('product-form').addEventListener('submit', saveProduct);
    $('add-variant').addEventListener('click', () => addVariantRow());
    $('cancel-edit').addEventListener('click', clearForm);
    $('upload-images').addEventListener('click', uploadImages);
    clearForm();
    loadProducts().catch((error) => setStatus(error.message, true));
  </script>
</body>
</html>
